<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythms and Reading</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .main-container {
            width: 98vw;
            height: 98vh;
            position: relative;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .sports-image {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* توقيع الأستاذ علي عسيري - في منتصف الصفحة تماماً */
        .author-badge {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffeb3b;
            padding: 8px 25px;
            font-size: 19px;
            font-weight: bold;
            border-radius: 22px;
            border: 2.5px solid #ffeb3b;
            z-index: 3000;
            pointer-events: none;
            direction: rtl;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        /* أزرار التحكم */
        .controls-header {
            position: absolute;
            top: 10px;
            right: 4%;
            display: flex;
            gap: 12px;
            z-index: 3000;
        }

        .mode-btn {
            padding: 10px 24px;
            font-size: 19px;
            font-weight: bold;
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s, background-color 0.2s;
            white-space: nowrap;
        }

        .mode-btn:hover {
            transform: scale(1.06);
        }

        .btn-practice { background-color: #22c55e; }

        @media (max-width: 1024px) {
            .author-badge { font-size: 14px; padding: 6px 15px; top: 6px; }
            .controls-header { gap: 6px; right: 2%; top: 6px; }
            .mode-btn { padding: 6px 12px; font-size: 14px; border-width: 2px; }
        }

        /* الطبقة التفاعلية للشفافيات */
        .hotspots-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s, border 0.2s;
        }

        .hotspot:hover {
            background-color: rgba(255, 235, 59, 0.25);
            border: 2px dashed #f59e0b;
        }

        /* النافذة المنبثقة لانتهاء التدريب */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 6000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 30px 50px;
            border-radius: 25px;
            text-align: center;
            color: #fff;
            border: 4px solid #ffeb3b;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            animation: popIn 0.4s ease;
            min-width: 320px;
            direction: rtl;
        }

        .modal-title { font-size: 30px; font-weight: bold; margin-bottom: 10px; color: #ffeb3b; }
        .modal-subtitle { font-size: 22px; margin-bottom: 25px; font-weight: bold; }
        .modal-ok-btn {
            background: #ffeb3b; color: #000; border: none; padding: 10px 40px;
            font-size: 22px; font-weight: bold; border-radius: 20px; cursor: pointer;
            transition: transform 0.2s;
        }
        .modal-ok-btn:hover {
            transform: scale(1.05);
        }

        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- توقيع المصمم في المنتصف تماماً -->
        <div class="author-badge">تصميم الأستاذ علي عسيري</div>

        <!-- أزرار التحكم -->
        <div class="controls-header">
            <button class="mode-btn btn-practice" onclick="startPracticeMode()">تدريب 🎯</button>
        </div>

        <!-- الصورة الرئيسية -->
        <img src="rhythmsandreading.png" alt="Rhythms and Reading" class="sports-image" id="sportsImg" onerror="this.src='rhythmsandreading.png'">

        <!-- الشفافيات موزعة على أسطر الجدول -->
        <div class="hotspots-overlay">
            <div class="hotspot" style="top: 36.5%; left: 3.5%; width: 93.0%; height: 12.0%;" onclick="handleItemClick('exciting.mp3', 'exciting')"></div>
            <div class="hotspot" style="top: 50.0%; left: 3.5%; width: 93.0%; height: 12.0%;" onclick="handleItemClick('boring.mp3', 'boring')"></div>
            <div class="hotspot" style="top: 63.5%; left: 3.5%; width: 93.0%; height: 12.0%;" onclick="handleItemClick('dangerous.mp3', 'dangerous')"></div>
            <div class="hotspot" style="top: 77.0%; left: 3.5%; width: 93.0%; height: 12.0%;" onclick="handleItemClick('difficult.mp3', 'difficult')"></div>
        </div>

        <!-- النافذة المنبثقة لانتهاء التدريب -->
        <div id="finishModal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-title">أحسنت يا بطل! 🎉</div>
                <div class="modal-subtitle">لقد أتممت الجولة التدريبية بنجاح 🌟</div>
                <button class="modal-ok-btn" onclick="closeFinishModal()">موافق</button>
            </div>
        </div>
    </div>

    <!-- نافذة نظام الحماية -->
    <div id="expiryOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); z-index:99999; justify-content:center; align-items:center;">
        <div style="background:linear-gradient(135deg, #e74c3c, #c0392b); padding:40px; border-radius:20px; text-align:center; color:white; box-shadow:0 10px 30px rgba(0,0,0,0.7); max-width:450px; width:90%; border:4px solid #fff;">
            <h2 style="font-size:30px; margin-bottom:15px; text-shadow:2px 2px 4px rgba(0,0,0,0.4);">رسالة تنبيه</h2>
            <p style="font-size:20px; margin-bottom:25px; font-weight:bold;">تم تعطيل البرنامج</p>
            <button onclick="closeApp()" style="background-color:#2ecc71; color:white; border:2px solid white; padding:10px 30px; font-size:18px; font-weight:bold; border-radius:10px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.3); transition:0.2s;">موافق</button>
        </div>
    </div>

    <script>
        let currentMode = 'normal';
        let currentTarget = null;
        let practiceQueue = [];
        let currentPlayingAudio = null;

        const itemsList = [
            { audio: 'exciting.mp3', text: 'exciting' },
            { audio: 'boring.mp3', text: 'boring' },
            { audio: 'dangerous.mp3', text: 'dangerous' },
            { audio: 'difficult.mp3', text: 'difficult' }
        ];

        /* --- نظام التحميل المسبق للأصوات (التسريع) --- */
        const preloadedAudios = {};
        const soundFilesList = [
            'exciting.mp3', 'boring.mp3', 'dangerous.mp3', 'difficult.mp3',
            'good.mp3', 'alert.mp3', 'goodjob.mp3', 'clapping.mp3'
        ];

        function preloadAllSounds() {
            soundFilesList.forEach(file => {
                const snd = new Audio(file);
                snd.preload = 'auto';
                preloadedAudios[file] = snd;
            });
        }
        preloadAllSounds();

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function stopCurrentAudio() {
            if (currentPlayingAudio) {
                currentPlayingAudio.pause();
                try {
                    currentPlayingAudio.currentTime = 0;
                } catch(e) {}
                currentPlayingAudio = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function playAudio(filename) {
            stopCurrentAudio();
            let audio = preloadedAudios[filename];
            if (!audio) {
                audio = new Audio(filename);
            }
            audio.currentTime = 0;
            currentPlayingAudio = audio;
            audio.play().catch(() => {});
            return audio;
        }

        function playAudioAsync(filename) {
            return new Promise((resolve) => {
                stopCurrentAudio();
                let audio = preloadedAudios[filename];
                if (!audio) {
                    audio = new Audio(filename);
                }
                audio.currentTime = 0;
                currentPlayingAudio = audio;
                
                audio.onended = () => { currentPlayingAudio = null; resolve(); };
                audio.onerror = () => { currentPlayingAudio = null; resolve(); };
                audio.play().catch(() => { currentPlayingAudio = null; resolve(); });
                
                setTimeout(() => {
                    if (currentPlayingAudio === audio) {
                        currentPlayingAudio = null;
                        resolve();
                    }
                }, 4000);
            });
        }

        function startPracticeMode() {
            currentMode = 'practice';
            practiceQueue = shuffleArray(itemsList);
            nextQuestion();
        }

        function nextQuestion() {
            if (practiceQueue.length > 0) {
                const currentItem = practiceQueue.pop();
                currentTarget = currentItem.text;
                playAudio(currentItem.audio);
            } else {
                showFinishModal();
            }
        }

        function showFinishModal() {
            playAudioAsync('goodjob.mp3').then(() => {
                playAudio('clapping.mp3');
            });
            document.getElementById('finishModal').style.display = 'flex';
        }

        function closeFinishModal() {
            document.getElementById('finishModal').style.display = 'none';
            location.reload();
        }

        function handleItemClick(audioFile, text) {
            if (currentMode === 'normal') {
                playAudio(audioFile);
            } else if (currentMode === 'practice') {
                if (text === currentTarget) {
                    playAudioAsync('good.mp3').then(() => {
                        setTimeout(() => { nextQuestion(); }, 300);
                    });
                } else {
                    playAudioAsync('alert.mp3').then(() => {
                        setTimeout(() => {
                            const currentItemObj = itemsList.find(item => item.text === currentTarget);
                            if (currentItemObj) playAudio(currentItemObj.audio);
                        }, 300);
                    });
                }
            }
        }

        /* --- نظام الحماية والتوقيت --- */
        const expiryDate = new Date(2026, 11, 31, 0, 0, 0).getTime();

        function checkProgramExpiry() {
            const now = new Date().getTime();
            if (now >= expiryDate) {
                document.getElementById('expiryOverlay').style.display = 'flex';
                document.body.style.pointerEvents = 'none';
                document.getElementById('expiryOverlay').style.pointerEvents = 'auto';
            }
        }

        function closeApp() {
            window.close();
            document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:20vh;'>تم إغلاق البرنامج نهائياً.</h1>";
        }

        setInterval(checkProgramExpiry, 1000);
        window.onload = checkProgramExpiry;
    </script>
</body>
</html>
